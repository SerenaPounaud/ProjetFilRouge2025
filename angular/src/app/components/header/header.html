<header class="header">
    <nav aria-label="Navigation principale">
        
        <div class="nav-gauche">
            <a routerLink="">Accueil</a>
            <a routerLink="/contact">Contact</a>
        </div>
        
        <div class="nav-centre">
            <a routerLink="" class="logo-link">
                <img src="assets/img/poele.webp" alt="Logo d'une poêle" class="logo">
                <span class="titreHeader">
                    <strong>Miam & Co<br>Recettes du monde</strong>
                </span>
            </a>
        </div>

        <div class="nav-droite">
            @if(!isConnected){
                <a class="sign-in" routerLink="/sign-in">Se connecter</a>
                <a class="sign-up" routerLink="/sign-up">S'inscrire</a>
            } @else {
                <a routerLink="/profil">Profil</a>
                <a class="logout" type="button" (click)="logout()">Se déconnecter</a>
            }
        </div>
    </nav>
</header>
