<section class="middleIndex">

    <app-zone-recette-categories (categorySelected)="applyFilters($event)"/>

    <div class="zone_recettes">
        <div class="zone_recherche">
            <form class="barre_recherche" role="search"> <!--barre de recherche pour rechercher par mots clés + nb de personnes-->
                <button type="submit" id="btn_recherche" aria-label="Rechercher une recette">
                    <img src="assets/img/loupe.svg" height="15px" alt="Loupe de recherche" aria-hidden="true">
                </button>
                <input type="text" id="barre_recherche" placeholder="Rechercher par mots clés..." aria-label="Champ de recherche par mots clés">
            </form>
                <div class="filtre">
                    <div>    
                        <label for="btn_personnes">Filtrer par : Personnes</label>
                        <select id="btn_personnes" [(ngModel)]="nbPersonnes" (change)="applyFilters()">
                            <option value="">Toutes les recettes</option>
                            <option value="1">Pour 1 personne</option>
                            <option value="2">Pour 2 personnes</option>
                            <option value="3">Pour 3 personnes</option>
                            <option value="4">Pour 4 personnes</option>
                            <option value="plus5">5 personnes ou plus</option>
                        </select>
                    </div> 
                    <div>
                        <label for="btn_date">Filtrer par : Date</label>
                        <select id="btn_date" [(ngModel)]="dateTri" (change)="applyFilters()">
                            <option value="">Aucun tri</option>
                            <option value="recent">Récent</option>
                            <option value="ancien">Ancien</option>
                        </select>
                    </div>
                    <div class="reset">
                        <button id="btn_reset" type="button" aria-label="Réinitialiser la recherche" (click)="resetFilters()">Réinitialiser</button>
                    </div>
                        
                </div>
    </div>

        <section class="recettes" id="recettes">
            @if (isLoading) {
                <p role="status">Chargement des recettes...</p>
            } @else if (errorMessage) {
                <div class="message-erreur" role="alert">
                    <p>{{ errorMessage }}</p>
                </div>
            } @else {
                @for (recipe of recipes; track recipe._id) {
                    <app-zone-recette-liste-recettes [recipes]="recipe"/>
                } @empty {
                    <p>Aucune recette trouvée.</p>
                }
            }
        </section>


        <div class="pagination">
            <button (click)="previousPage()" [disabled]="page === 1" aria-label="Page précédente" title="Page précédente">←</button>
            <span>Page {{ page }} / {{ totalPages }}</span>
            <button (click)="nextPage()" [disabled]="page >= totalPages" aria-label="Page suivante" title="Page suivante">→</button>
        </div>

    </div>
</section>
